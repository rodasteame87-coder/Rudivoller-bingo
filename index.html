<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rudivoller Bingo</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        body {
            margin: 0;
            padding: 20px 10px;
            background: #10131a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
        }

        #status {
            margin: 10px;
            color: #aaa;
        }

        .board {
            max-width: 420px;
            margin: auto;
        }

        .headers,
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        .headers div {
            padding: 8px;
            font-size: 22px;
            font-weight: bold;
        }

        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #252c38;
            border-radius: 8px;
            font-size: 25px;
            font-weight: bold;
        }

        .cell.called {
            background: #f5b400;
            color: black;
        }

        .free {
            background: #555;
            font-size: 15px;
        }

        button {
            margin-top: 20px;
            padding: 14px 30px;
            border: 0;
            border-radius: 10px;
            background: #e53935;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.97);
        }

        #message {
            margin-top: 15px;
            font-size: 16px;
        }

    </style>

</head>

<body>

    <h1>🎯 Rudivoller Bingo</h1>

    <div id="status">
        Connecting to Telegram...
    </div>

    <div class="board">

        <div class="headers">
            <div>B</div>
            <div>I</div>
            <div>N</div>
            <div>G</div>
            <div>O</div>
        </div>

        <div
            id="grid"
            class="grid"
        ></div>

    </div>

    <button onclick="claimBingo()">
        🎉 BINGO!
    </button>

    <div id="message"></div>


<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


let userId = null;
let card = [];
let called = [];


function show(message) {

    document.getElementById("message")
        .textContent = message;

}


function renderCard() {

    const grid =
        document.getElementById("grid");

    grid.innerHTML = "";

    if (!card || card.length !== 25) {
        return;
    }

    card.forEach((number, index) => {

        const cell =
            document.createElement("div");

        cell.className = "cell";

        if (index === 12) {

            cell.classList.add("free");
            cell.textContent = "FREE";

        } else {

            cell.textContent = number;

            if (called.includes(number)) {
                cell.classList.add("called");
            }

        }

        grid.appendChild(cell);

    });

}


async function joinGame() {

    const user =
        tg.initDataUnsafe.user;

    if (!user) {

        document.getElementById("status")
            .textContent =
            "❌ Please open Bingo from Telegram.";

        return;

    }

    userId = String(user.id);

    const name =
        user.first_name ||
        user.username ||
        "Player";


    try {

        const response =
            await fetch("/api/join", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    user_id: userId,
                    name: name

                })

            });


        const data =
            await response.json();


        if (!response.ok || !data.ok) {

            document.getElementById("status")
                .textContent =
                "❌ Could not join the game.";

            show(
                data.error ||
                data.message ||
                "Join failed."
            );

            return;

        }


        card = data.card || [];

        renderCard();


        document.getElementById("status")
            .textContent =
            "🟢 Joined Bingo successfully!";


        show(
            "Welcome " +
            data.name +
            "! Your Bingo card is ready."
        );


        updateState();

    } catch (error) {

        console.error(error);

        document.getElementById("status")
            .textContent =
            "❌ Connection error.";

        show(
            "Could not connect to the Bingo server."
        );

    }

}


async function updateState() {

    try {

        const response =
            await fetch("/api/state");

        const data =
            await response.json();

        called =
            data.called || [];

        renderCard();


        if (data.running) {

            document.getElementById("status")
                .textContent =
                "🟢 GAME LIVE • Players: " +
                data.players;

        } else {

            document.getElementById("status")
                .textContent =
                "🔴 GAME STOPPED • Players: " +
                data.players;

        }

    } catch (error) {

        console.error(error);

    }

}


async function claimBingo() {

    if (!userId) {

        show(
            "❌ You must join the game first."
        );

        return;

    }


    try {

        const response =
            await fetch("/api/claim", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    user_id: userId

                })

            });


        const data =
            await response.json();


        show(
            data.message ||
            "No Bingo yet."
        );


        if (data.bingo) {

            tg.showAlert(
                "🎉 BINGO! Congratulations!"
            );

        }

    } catch (error) {

        console.error(error);

        show(
            "❌ Could not check Bingo."
        );

    }

}


joinGame();


setInterval(
    updateState,
    2000
);

</script>

</body>

</html>
